[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ya-news-parser"
version = "0.1.0"
description = "Сбор заголовков Яндекс.Новостей (dzen.ru/news) в CSV"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
ya-news-parser = "ya_news_parser.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ya_news_parser"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
